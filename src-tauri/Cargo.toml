[package]
name = "kubecli"
version = "0.1.0"
edition = "2021"

[lib]
name = "kubecli_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
portable-pty = "0.8"
dirs = "5"
lazy_static = "1.4"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-opener = "=2.5.3"
libc = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
